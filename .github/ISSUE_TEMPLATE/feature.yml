name: 功能请求
title: "[Feature] 请填写简短易读的标题"
description: "向 cyocyo10 维护版建议功能或体验改进"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        这里是 cyocyo10 维护的 fork，重点维护 Windows 的 AllLive 使用体验并兼顾 Android。
        请说明使用场景、预期行为和涉及平台；原作者不负责处理本 fork 的请求。

  - type: checkboxes
    id: terms
    attributes:
      label: 非重复的Issue
      description: 先去Issues列表中查找下是否存在相似的Issue，如果有了就不要重复发了
      options:
        - label: 已确认没有相似的Issue
          required: true

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: 功能描述
      description: 请填写功能描述，如果你有多个建议、请求，请分开提交Issue

  - type: checkboxes
    id: platform
    attributes:
      label: 平台
      description: 这个功能针对什么平台
      options:
        - label: Android
        - label: iOS
        - label: MacOS
        - label: Windows
        - label: Linux
        - label: Android TV

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 可以附加相关截图、视频或参考链接，并注明来源

